[package]
name = "vectorz-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts vectorz-text bundles for documents, through the engine's `bundled-fonts`, as
# vectorz-ui-egui's. Off, for an embedder that supplies every document font at run time.
bundled-fonts = ["vectorz-engine/bundled-fonts"]

[dependencies]
vectorz-engine = { workspace = true }
vectorz-render = { workspace = true }
vectorz-svg = { workspace = true }
vectorz-format = { workspace = true }
vectorz-tools = { workspace = true }
vectorz-geom = { workspace = true }
vectorz-doc = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

image = { workspace = true }

[dev-dependencies]
vectorz-testkit = { workspace = true }
proptest = { workspace = true }
socket2 = { workspace = true }
