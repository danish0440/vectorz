[package]
name = "vectorz-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ live effects evaluated to geometry"

[lints]
workspace = true

[dependencies]
vectorz-geom = { workspace = true }
vectorz-three-d = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-pathops = { workspace = true }
vectorz-text = { workspace = true }
vectorz-plugins = { workspace = true }
vectorz-trace = { workspace = true }
image = { workspace = true }
kurbo = { workspace = true }
# Effect › SVG Filters draws its filters with resvg (MIT OR Apache-2.0), at the usvg version the
# workspace reads SVG with; raster-images decodes the object's pixels it hands the filter as a PNG.
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
# The number lists of filter attributes, read as usvg reads them (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"
serde_json = { workspace = true }

[dev-dependencies]
vectorz-color = { workspace = true }
# A face built in code from the bundled Source Sans 3 (no font file is committed).
vectorz-text = { workspace = true, features = ["test-fonts"] }
# Test live-effect plug-ins written in WebAssembly text.
wat = { workspace = true }
