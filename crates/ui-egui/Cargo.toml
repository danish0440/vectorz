[package]
name = "vectorz-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ egui frontend (menus, panels, tools and canvas); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
vectorz-geom = { workspace = true }
vectorz-color = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-brush = { workspace = true }
vectorz-render = { workspace = true }
vectorz-text = { workspace = true }
vectorz-tools = { workspace = true }
vectorz-engine = { workspace = true }
vectorz-svg = { workspace = true }
vectorz-effects = { workspace = true }
vectorz-three-d = { workspace = true }
vectorz-plugins = { workspace = true }
vectorz-pdf = { workspace = true }
vectorz-cad = { workspace = true }
vectorz-eps = { workspace = true }
vectorz-format = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
vectorz-testkit = { workspace = true }
wat = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
