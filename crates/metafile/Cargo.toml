[package]
name = "vectorz-metafile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ Windows metafiles: hand-written EMF and WMF writers and readers"

[lints]
workspace = true

[dependencies]
vectorz-geom = { workspace = true }
vectorz-color = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-effects = { workspace = true }
vectorz-brush = { workspace = true }
vectorz-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
vectorz-text = { workspace = true, features = ["bundled-fonts"] }
