[package]
name = "vectorz-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ renderer: document to pixels (vello_cpu backend)"

[lints]
workspace = true

[dependencies]
vectorz-geom = { workspace = true }
vectorz-color = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-text = { workspace = true }
vectorz-effects = { workspace = true }
vectorz-brush = { workspace = true }
vello_cpu = { workspace = true }
# Filter types (Gaussian blur, drop shadow) are not re-exported by vello_cpu 0.2.
vello_common = { version = "0.2", default-features = false }
image = { workspace = true }
craft-gif = { workspace = true }
craft-image-codecs = { workspace = true }
jpeg-encoder = { workspace = true }
craft-stream-codecs = { workspace = true }
flate2 = { workspace = true }
log = { workspace = true }
# Combining marks inside a lam-alef cluster (MIT OR Apache-2.0; already used by vectorz-text).
unicode-general-category = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

# The shared image store's budget (src/images.rs) follows the installed memory, which it reads with GlobalMemoryStatusEx
# through winsafe's safe wrappers over Win32 (MIT), which vectorz-cli's src/perf.rs also uses.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
# The TIFF LZW writer before craft-stream-codecs, the reference encode/tests_tiff.rs compares it with.
weezl = "0.2"
vectorz-testkit = { workspace = true }
# A variable font built in code (no font file is committed).
vectorz-text = { workspace = true, features = ["test-fonts"] }
# Live-effect plug-ins the cache tests install, written in WebAssembly text.
vectorz-plugins = { workspace = true }
wat = { workspace = true }
# Decoders the export tests read their files back with.
image = { workspace = true }
craft-tiff = { workspace = true }
craft-psd = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
