[package]
name = "vectorz-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
vectorz-geom = { workspace = true }
vectorz-color = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-effects = { workspace = true }
vectorz-brush = { workspace = true }
vectorz-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
vectorz-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
vectorz-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
vectorz-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
# Images read through `CCITTFaxDecode`.
hayro-ccitt = { workspace = true }
# Live effects' params, as the art styles that name them give them.
serde_json = { workspace = true }

[dev-dependencies]
vectorz-testkit = { workspace = true }
vectorz-text = { workspace = true, features = ["test-fonts"] }
# Tests: a Group 4 encoder and the T.4 run codes, to write CCITT test images.
fax = "0.2"
