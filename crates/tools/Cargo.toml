[package]
name = "vectorz-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
vectorz-geom = { workspace = true }
vectorz-color = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-brush = { workspace = true }
vectorz-pathops = { workspace = true }
vectorz-effects = { workspace = true }
vectorz-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
vectorz-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
