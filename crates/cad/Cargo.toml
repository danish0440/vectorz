[package]
name = "vectorz-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ CAD interchange: a hand-written ASCII DXF writer (R12 to 2018)"

[lints]
workspace = true

[dependencies]
vectorz-geom = { workspace = true }
vectorz-color = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-effects = { workspace = true }
vectorz-brush = { workspace = true }
vectorz-pathops = { workspace = true }
vectorz-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine)
# and in fonts built in code (`vectorz_text::test_fonts`).
vectorz-text = { workspace = true, features = ["bundled-fonts", "test-fonts"] }
