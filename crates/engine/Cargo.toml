[package]
name = "vectorz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorZ engine: sessions, history, selection, the command registry"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts vectorz-text bundles (see its `bundled-fonts`). Embedders that supply every font at
# run time (`vectorz_text::FontDb::add_font`) build with `default-features = false`.
bundled-fonts = ["vectorz-text/bundled-fonts"]

[dependencies]
# Which paths stored in documents may be opened.
craft-docpath = { workspace = true }
vectorz-geom = { workspace = true }
vectorz-color = { workspace = true }
vectorz-doc = { workspace = true }
vectorz-tools = { workspace = true }
vectorz-text = { workspace = true }
vectorz-render = { workspace = true }
vectorz-pathops = { workspace = true }
vectorz-brush = { workspace = true }
vectorz-trace = { workspace = true }
vectorz-svg = { workspace = true }
vectorz-format = { workspace = true }
vectorz-pdf = { workspace = true }
vectorz-cad = { workspace = true }
vectorz-eps = { workspace = true }
vectorz-metafile = { workspace = true }
vectorz-plugins = { workspace = true }
vectorz-affinity = { workspace = true }
vectorz-scriptcheck = { workspace = true }
image = { workspace = true }
hayro-jpeg2000 = { version = "=0.3.5", default-features = false, features = ["std", "simd"] }
flate2 = { workspace = true }
# The XML parts of Word documents placed as type (place/docx.rs).
roxmltree = "0.21"
# The compound file that holds a Word 97-2003 document placed as type (place/doc.rs).
cfb = "0.15"
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Whether a recovery area folder is this account's own (`FolderStore::own_area`). Already in
# Cargo.lock (tempfile, ui-egui), so this adds no new crate.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
vectorz-affinity = { workspace = true, features = ["synth"] }
crc32fast = { workspace = true }
vectorz-testkit = { workspace = true }
proptest = { workspace = true }
# A variable font built in code (no font file is committed).
vectorz-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }
# Zstandard streams for the Illustrator editing data fuzz tests.
ruzstd = { workspace = true }
